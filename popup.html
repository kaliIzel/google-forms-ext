<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Forms Extractor</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 540px; max-width: 100vw; font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; color: #1f2328; background: #f8f9fa; }
    .hidden, [hidden] { display: none !important; }

    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #e0e0e0; }
    .app-header h1 { margin: 0; font-size: 15px; font-weight: 700; color: #174ea6; }
    .status-chip { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; padding: 3px 10px; border-radius: 999px; background: #f1f3f4; color: #5f6368; }
    .status-extracting { background: #fef7e0; color: #b06000; }
    .status-success { background: #e6f4ea; color: #137333; }
    .status-error { background: #fce8e6; color: #b31412; }

    main { padding: 14px 16px 16px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid #dadce0; background: #fff; color: #1f2328; border-radius: 8px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn:hover:not(:disabled) { background: #f1f3f4; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.secondary { width: 100%; margin-top: 8px; }
    .btn.primary { width: 100%; background: #1a73e8; border-color: #1a73e8; color: #fff; }
    .btn.primary:hover:not(:disabled) { background: #1765cc; }
    .btn.done { background: #e6f4ea; border-color: #81c995; color: #137333; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #resultBox { margin-top: 14px; }

    #summary { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .summary-title { font-weight: 700; font-size: 14px; margin-bottom: 8px; word-break: break-word; }
    .summary-stats { display: flex; gap: 10px; }
    .stat { flex: 1; background: #e8f0fe; border-radius: 8px; padding: 8px; text-align: center; }
    .stat-num { display: block; font-size: 20px; font-weight: 700; color: #174ea6; }
    .stat-label { font-size: 11px; color: #5f6368; }
    .summary-types { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .type-chip { font-size: 11px; background: #f1f3f4; border-radius: 999px; padding: 2px 9px; color: #3c4043; }
    .summary-warn { margin-top: 8px; font-size: 11.5px; color: #b06000; background: #fef7e0; border-radius: 6px; padding: 5px 9px; }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid #dadce0; margin-bottom: 0; }
    .tab { border: 0; background: transparent; padding: 8px 14px; font: inherit; font-weight: 600; color: #5f6368; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }

    .preview, .viewer { margin: 0; background: #fff; border: 1px solid #e0e0e0; border-top: 0; border-radius: 0 0 10px 10px; padding: 14px; height: 380px; overflow: auto; }
    .viewer { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

    .toolbar { display: flex; gap: 8px; margin-top: 12px; }
    .toolbar .btn { flex: 1; }
    @media (max-width: 560px) {
      .toolbar { flex-wrap: wrap; }
      .toolbar .btn { flex: 1 1 100%; min-height: 44px; }
      .preview, .viewer { height: 55vh; }
      .btn { min-height: 44px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>Google Forms Extractor</h1>
    <span id="statusChip" class="status-chip status-idle" role="status">Listo</span>
  </header>

  <main>
    <button id="btnExtract" class="btn primary" type="button">
      <span class="spinner" hidden></span>
      <span class="btn-label">Extraer formulario</span>
    </button>
    <button id="btnToggleBar" class="btn secondary" type="button">
      <span class="btn-label">Mostrar / ocultar barra flotante</span>
    </button>

    <section id="resultBox" class="hidden">
      <div id="summary"></div>

      <div class="tabs" role="tablist">
        <button id="viewPreview" class="tab active" type="button" role="tab" aria-selected="true">Vista previa</button>
        <button id="viewMarkdown" class="tab" type="button" role="tab" aria-selected="false">Markdown</button>
        <button id="viewJson" class="tab" type="button" role="tab" aria-selected="false">JSON</button>
      </div>

      <div id="preview" class="preview"></div>
      <pre id="viewer" class="viewer hidden"></pre>

      <div class="toolbar">
        <button id="btnCopy" class="btn" type="button" disabled><span class="btn-label">Copiar Markdown</span></button>
        <button id="btnDownload" class="btn" type="button" disabled><span class="btn-label">Descargar JSON</span></button>
        <button id="btnPdf" class="btn" type="button" disabled><span class="btn-label">Exportar PDF</span></button>
      </div>
    </section>
  </main>

  <script src="render.js"></script>
  <script src="popup.js"></script>
</body>
</html>
